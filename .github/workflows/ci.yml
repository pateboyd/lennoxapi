name: Lennox API CI
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
    branches: [master]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test -- --runInBand
      - run: npm run build
